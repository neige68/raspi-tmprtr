[project]
name = "raspi-tmprtr-server"
version = "0.1.0"
description = "Temperature monitoring server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "loguru>=0.7.3",
    "pymysql>=1.1.3",
    "pyotp>=2.9.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
